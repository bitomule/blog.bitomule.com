<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The bottleneck moved from code production to validation</title>
  <desc id="desc">A before and after diagram showing code production as the old bottleneck and validation as the new bottleneck after AI agents generate code.</desc>
  <rect width="1200" height="675" fill="#f8f7f3"/>
  <rect x="40" y="40" width="1120" height="595" rx="18" fill="#ffffff" stroke="#dedbd2" stroke-width="2"/>
  <text x="72" y="96" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="750">The bottleneck moved</text>
  <text x="72" y="132" fill="#64645f" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Agents make code cheaper to produce. They do not make it cheaper to trust.</text>

  <g transform="translate(72 190)">
    <text x="0" y="0" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Before agents</text>
    <rect x="0" y="38" width="160" height="86" rx="10" fill="#f0eee7" stroke="#dedbd2" stroke-width="2"/>
    <rect x="230" y="22" width="116" height="118" rx="10" fill="#2364aa" opacity="0.16" stroke="#2364aa" stroke-width="3"/>
    <rect x="416" y="38" width="160" height="86" rx="10" fill="#f0eee7" stroke="#dedbd2" stroke-width="2"/>
    <rect x="646" y="38" width="160" height="86" rx="10" fill="#f0eee7" stroke="#dedbd2" stroke-width="2"/>
    <text x="80" y="89" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="650">Idea</text>
    <text x="288" y="74" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="750">Write</text>
    <text x="288" y="102" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="750">code</text>
    <text x="496" y="89" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="650">Review</text>
    <text x="726" y="89" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="650">Ship</text>
    <path d="M168 81 H218" stroke="#64645f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M354 81 H404" stroke="#64645f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M584 81 H634" stroke="#64645f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="288" y="168" text-anchor="middle" fill="#2364aa" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">scarce</text>
  </g>

  <g transform="translate(72 420)">
    <text x="0" y="0" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">With agents</text>
    <rect x="0" y="38" width="160" height="86" rx="10" fill="#f0eee7" stroke="#dedbd2" stroke-width="2"/>
    <rect x="230" y="38" width="160" height="86" rx="10" fill="#f0eee7" stroke="#dedbd2" stroke-width="2"/>
    <rect x="460" y="22" width="136" height="118" rx="10" fill="#2364aa" opacity="0.16" stroke="#2364aa" stroke-width="3"/>
    <rect x="666" y="38" width="160" height="86" rx="10" fill="#f0eee7" stroke="#dedbd2" stroke-width="2"/>
    <text x="80" y="89" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="650">Idea</text>
    <text x="310" y="74" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="650">Agent</text>
    <text x="310" y="102" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="650">writes</text>
    <text x="528" y="74" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="750">Validate</text>
    <text x="528" y="102" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="750">trust</text>
    <text x="746" y="89" text-anchor="middle" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="650">Ship</text>
    <path d="M168 81 H218" stroke="#64645f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M398 81 H448" stroke="#64645f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M604 81 H654" stroke="#64645f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="528" y="168" text-anchor="middle" fill="#2364aa" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">scarce now</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64645f"/>
    </marker>
  </defs>
</svg>

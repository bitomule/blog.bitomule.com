<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Parallel agent work increases supervision load</title>
  <desc id="desc">A diagram showing three parallel git worktrees producing changes that converge into one human supervision and validation queue.</desc>
  <rect width="1200" height="675" fill="#f8f7f3"/>
  <rect x="40" y="40" width="1120" height="595" rx="18" fill="#ffffff" stroke="#dedbd2" stroke-width="2"/>
  <text x="72" y="96" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="750">Parallelism is not free</text>
  <text x="72" y="132" fill="#64645f" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">More worktrees can mean more output, and more supervision waiting for you.</text>

  <g transform="translate(86 205)">
    <g>
      <rect x="0" y="0" width="255" height="108" rx="12" fill="#f0eee7" stroke="#dedbd2" stroke-width="2"/>
      <text x="24" y="34" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">worktree A</text>
      <text x="24" y="68" fill="#64645f" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">refactor</text>
      <text x="24" y="93" fill="#2364aa" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">agent output</text>
    </g>
    <g transform="translate(0 145)">
      <rect x="0" y="0" width="255" height="108" rx="12" fill="#f0eee7" stroke="#dedbd2" stroke-width="2"/>
      <text x="24" y="34" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">worktree B</text>
      <text x="24" y="68" fill="#64645f" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">bug fix</text>
      <text x="24" y="93" fill="#2364aa" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">agent output</text>
    </g>
    <g transform="translate(0 290)">
      <rect x="0" y="0" width="255" height="108" rx="12" fill="#f0eee7" stroke="#dedbd2" stroke-width="2"/>
      <text x="24" y="34" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">worktree C</text>
      <text x="24" y="68" fill="#64645f" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">exploration</text>
      <text x="24" y="93" fill="#2364aa" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">agent output</text>
    </g>
  </g>

  <path d="M360 260 C470 260 505 337 600 337" stroke="#64645f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M360 405 C470 405 505 337 600 337" stroke="#64645f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M360 550 C470 550 505 337 600 337" stroke="#64645f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(625 220)">
    <rect x="0" y="0" width="430" height="250" rx="16" fill="#2364aa" opacity="0.12" stroke="#2364aa" stroke-width="3"/>
    <text x="32" y="48" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="750">Human validation queue</text>
    <text x="32" y="92" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Understand the diff</text>
    <text x="32" y="127" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Reload partial context</text>
    <text x="32" y="162" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Run checks</text>
    <text x="32" y="197" fill="#191919" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Correct and decide</text>
  </g>

  <text x="840" y="542" text-anchor="middle" fill="#64645f" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Output scales faster than focus.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64645f"/>
    </marker>
  </defs>
</svg>
